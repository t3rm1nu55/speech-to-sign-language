[pytest]
# Pytest configuration
env =
    DATABASE_URL=sqlite:///:memory:
    CACHE_ENABLED=false
    PROCESSING_MODE=on-device
    RATE_LIMIT_ENABLED=false
    API_KEY_ENABLED=false

addopts = -v --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
